# CI for every PR and every push to main.
#
# The job names `build`, `docs-lint` and `authorship` are required checks in
# the `main` ruleset (F1-01, F1-06). Renaming a job breaks the merge gate: change the ruleset in
# the same PR. No `paths:` filter, so a required job never ends up skipped.
#
# Rules (AGENTS.md §8): runs on `pull_request`, never `pull_request_target`;
# read-only token; actions pinned by full commit SHA (Dependabot keeps them
# current); checkout keeps no credentials. A secret is set with `env:` on the
# step that uses it, never on the job or the workflow. Untrusted text (the PR
# title and body) reaches a script only through `env:`, never through `${{ }}`
# inside `run:`.
name: CI

on:
  pull_request:
    # `edited`: a changed PR title or body is checked again (F1-06).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main, so every main commit keeps a completed check.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make lint
      - run: make build

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-lint

  # F1-06: no block-list term or blocked name in the tracked files, the built
  # site or the PR text. A missing or empty names secret fails the job, so a PR
  # from a fork (no secrets) fails it too. Dependabot PRs read the Dependabot
  # secret of the same name. The step runs the PR's own copy of the script with
  # the secret, so only a branch of this repository can see it: Filipe's, the
  # GitHub App's (its code is the generation job; the model writes only posts)
  # and Dependabot's.
  authorship:
    name: authorship
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make build
      - run: make test
      - name: Check authorship
        env:
          AUTHORSHIP_BLOCKED_NAMES: ${{ secrets.AUTHORSHIP_BLOCKED_NAMES }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make authorship
